[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-eval-forge"
version = "0.1.0"
description = "Reproducible ML evaluation, calibration, validation, and inference benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sanusi Abdulfatai Oyewunmi" }]
dependencies = ["numpy>=1.24"]

[project.scripts]
ml-eval-forge = "ml_eval_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
